<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Developer Preview Access</title><link rel="icon" href="favicon.png"><link rel="stylesheet" href="style.css"></head>
<body><main style="min-height:100vh;display:grid;place-items:center;padding:24px"><section class="auth-card" style="width:min(460px,100%)"><p class="eyebrow">Developer Preview</p><h1>Authorized access only</h1><p class="auth-sub">Sign in with the authorized developer account to continue while Maintenance Mode is enabled.</p><form id="devLogin"><div class="form-grid"><label class="field"><span>Email Address</span><input id="email" type="email" autocomplete="username" required></label><label class="field"><span>Password</span><input id="password" type="password" autocomplete="current-password" required></label></div><p id="msg" class="alert alert-error" hidden></p><div class="form-foot"><button class="btn btn-primary btn-lg btn-block" type="submit">Continue to preview</button></div></form></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(function(){const sb=supabase.createClient("https://wdrgcavxwamwqgxkdscn.supabase.co","sb_publishable_XlL1WvosmoBvl3vttrT-xw_nVvtMrQo");const f=document.getElementById("devLogin"),m=document.getElementById("msg");f.addEventListener("submit",async e=>{e.preventDefault();m.hidden=true;const b=f.querySelector("button");b.disabled=true;try{const r=await sb.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});if(r.error)throw r.error;const s=await sb.auth.getSession();const token=s.data.session&&s.data.session.access_token;if(!token)throw new Error("Authentication session was not created.");const x=await fetch("/api/dev-preview",{method:"POST",headers:{Authorization:"Bearer "+token},credentials:"include"});if(x.status===403)throw new Error("This account is not authorized for developer preview access.");if(!x.ok)throw new Error("Developer preview is not configured correctly.");location.replace("/#/dashboard");}catch(err){m.textContent=err.message||"Unable to authorize developer preview.";m.hidden=false;await sb.auth.signOut();b.disabled=false;}});})();
</script></body></html>
